name: Проверка модуля

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-pf1-ru-review
          path: |
            dist/module.json
            dist/foundry-pf1-ru.zip
          if-no-files-found: error
